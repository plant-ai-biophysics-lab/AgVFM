[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlme"
version = "0.1.0"
description = "VLM-Experiments: vision-language and detection utilities (YOLO World, GT vs predictions)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "Pillow",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vlme*"]
